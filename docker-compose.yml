services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: venture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-venture}
      POSTGRES_DB: ventureplan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venture -d ventureplan"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: [./backend/.env]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  backend:
    build: ./backend
    env_file: [./backend/.env]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 30s
    env_file: [./backend/.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
    restart: unless-stopped
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGDATABASE: ventureplan
      PGUSER: venture
      PGPASSWORD: ${POSTGRES_PASSWORD:-venture}
    entrypoint: ["sh", "/usr/local/bin/ventureplan-backup"]
    volumes:
      - ./ops/backup.sh:/usr/local/bin/ventureplan-backup:ro
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  pgdata:
